name: align-test (temporary)
on:
  push:
    branches: [align-uploaded-audio]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q faster-whisper gTTS
      - name: sample
        run: |
          cat > /tmp/t.txt <<'TXT'
          كان يا ما كان، في قديم الزمان، فتاة صغيرة اسمها ليلى.
          كانت ليلى تحب النجوم كثيرًا.
          ليلى: يا قمر، هل تسمعني؟
          في كل ليلة كانت تصعد إلى سطح البيت وتنظر إلى السماء.
          وفي ليلة هادئة، سمعت صوتًا خفيفًا يناديها من بعيد.
          TXT
          python -c "from gtts import gTTS; t=open('/tmp/t.txt').read().replace('ليلى: ',''); gTTS(t, lang='ar').save('/tmp/t.mp3')"
          ffmpeg -loglevel error -i /tmp/t.mp3 -ac 1 -ar 16000 /tmp/t.wav
      - name: align
        run: time python tools/aligner.py /tmp/t.wav /tmp/t.txt
