name: لوحة الإدارة

on:
  push:
    branches: [main]
    paths: ['admin/**', '.github/workflows/admin-web.yml']
  pull_request:
    paths: ['admin/**', '.github/workflows/admin-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: بناء نسخة الويب
        run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"
      - name: صفحة 404 (حتى تعمل الروابط المباشرة)
        run: cp build/web/index.html build/web/404.html
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: admin/build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
