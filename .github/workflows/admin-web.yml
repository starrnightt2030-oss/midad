name: لوحة الإدارة

on:
  push:
    branches: [main]
    paths: ['admin/**', 'tools/ci/patch_admin_android.py', '.github/workflows/admin-web.yml']
  pull_request:
    paths: ['admin/**', 'tools/ci/patch_admin_android.py', '.github/workflows/admin-web.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: admin-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: بناء نسخة الويب
        run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"
      - name: صفحة 404 (حتى تعمل الروابط المباشرة)
        run: cp build/web/index.html build/web/404.html
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: admin/build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # تطبيق أندرويد للوحة الإدارة (نفس الكود)، يُنشر كإصدار منفصل لا يختلط بتحديثات تطبيق المستمع.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تجهيز مشروع أندرويد
        working-directory: admin
        run: |
          flutter create --platforms=android --org com.eldawly --project-name atheer_admin .
          rm -rf test
          python3 ../tools/ci/patch_admin_android.py
      - name: مفتاح التوقيع الثابت
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > ~/.android/debug.keystore; fi
      - name: بناء APK
        working-directory: admin
        run: |
          flutter pub get
          flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk ../atheer-admin-b${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk ../atheer-admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: atheer-admin-apk
          path: atheer-admin-*.apk
      - name: نشر الإصدار
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-b${{ github.run_number }}
          name: إدارة أثير — بناء ${{ github.run_number }}
          body: تطبيق لوحة الإدارة. نزّل ملف APK وثبّته على موبايلك.
          files: atheer-admin-b*.apk
          make_latest: false
      # إصدار ثابت «admin» يُستبدل ملفه كل مرة: رابط تحميل مباشر لا يتغير
      # https://github.com/<owner>/<repo>/releases/download/admin/atheer-admin.apk
      - name: تحديث رابط التحميل الثابت
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin
          name: إدارة أثير — آخر إصدار
          body: آخر نسخة من تطبيق لوحة الإدارة (تُحدَّث تلقائيًا). نزّل atheer-admin.apk وثبّته.
          files: atheer-admin.apk
          overwrite_files: true
          make_latest: false
