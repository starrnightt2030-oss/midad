name: فحص التزامن

# تشخيص فقط: يطبع توقيتات فصل وبيانات ملف صوته، ويعيد الضبط تجريبيًا للمقارنة، بدون حفظ أي شيء.
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'عنوان القصة (* = كل القصص)'
        required: true
        default: '*'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: https://scrynlokpplwolbltghf.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q faster-whisper
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1
      - name: فحص كل الفصول (أو قصة واحدة)
        run: |
          if [ "$TITLE" = "*" ]; then python tools/sync_audit.py; else python tools/sync_audit.py --title "$TITLE"; fi
        env:
          TITLE: ${{ github.event.inputs.title || '*' }}
