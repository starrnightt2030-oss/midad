name: فحص التزامن

# تشخيص فقط: يطبع توقيتات فصل وبيانات ملف صوته، بدون أي تعديل.
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'عنوان القصة'
        required: true
        default: 'حكايتي'
  push:
    branches: ['claude/**']
    paths: ['tools/inspect_sync.py', 'tools/asr_experiment.py', '.github/workflows/inspect-sync.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://scrynlokpplwolbltghf.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q faster-whisper
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1
      - run: python tools/asr_experiment.py
        env:
          TITLE: ${{ github.event.inputs.title || 'حكايتي' }}
