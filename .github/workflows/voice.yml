name: توليد الصوت

# لوحة الإدارة تضيف طلبات «توليد الصوت»، وهذا العامل ينفّذها كل ١٠ دقائق (مجاني للمستودعات العامة).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-worker
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: https://scrynlokpplwolbltghf.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: هل توجد طلبات؟
        id: check
        run: |
          N=$(curl -s "$SUPABASE_URL/rest/v1/voice_jobs?status=in.(pending,running)&select=id" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)")
          echo "طلبات: $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.n != '0'
        uses: actions/checkout@v5

      - if: steps.check.outputs.n != '0'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - if: steps.check.outputs.n != '0'
        name: الأدوات
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-genai

      - if: steps.check.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: tools/.cache
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      - if: steps.check.outputs.n != '0'
        name: توليد
        run: python tools/voice_worker.py
