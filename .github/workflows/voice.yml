name: توليد الصوت

# لوحة الإدارة تضيف طلبات «ضبط التوقيت» أو «توليد الصوت»، وهذا العامل ينفّذها كل ١٠ دقائق (مجاني للمستودعات العامة).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-worker
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: https://scrynlokpplwolbltghf.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      # يضيف تلقائيًا طلب «ضبط التوقيت» لأي فصل له صوت ونص بلا توقيت، ثم يعدّ الطلبات المنتظرة
      - name: هل توجد طلبات؟
        id: check
        run: |
          N=$(python3 tools/voice_worker.py --scan | tee /dev/stderr | tail -n 1)
          case "$N" in ''|*[!0-9]*) N=0 ;; esac
          echo "طلبات: $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.n != '0'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - if: steps.check.outputs.n != '0'
        name: الأدوات
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-genai faster-whisper

      - if: steps.check.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: tools/.cache
          key: tts-${{ github.run_id }}
          restore-keys: tts-

      # نموذج Whisper (حوالي ١.٥ جيجا) يُحمَّل مرة ويُحفظ
      - if: steps.check.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1

      - if: steps.check.outputs.n != '0'
        name: تنفيذ الطلبات
        run: python tools/voice_worker.py
