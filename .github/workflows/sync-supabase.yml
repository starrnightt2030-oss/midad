name: مزامنة المحتوى مع Supabase

# ينقل محتوى مجلد content/ إلى قاعدة Supabase.
# مؤقت لحين جاهزية لوحة الإدارة (المرحلة الثالثة)، بعدها تصبح اللوحة هي المصدر.
on:
  push:
    branches: [main]
    paths:
      - 'content/catalog.json'
      - 'content/chapters/**'
      - 'tools/sync_supabase.py'
  workflow_run:
    workflows: ['توليد الصوت والأغلفة']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-supabase
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: رفع المحتوى
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/sync_supabase.py
