name: atheer
description: "أثير — قصص وحكايات وحكم من الحياة، مسموعة ومقروءة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true
  assets:
    - content/
    - content/chapters/
    - content/ambience/
    - assets/brand/
    - assets/sounds/
    - content/covers/
